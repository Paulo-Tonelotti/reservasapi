server:
    port: 8084
spring:
    application:
        name: reservasapi
    datasource:
        url: jdbc:postgresql://localhost:5434/reservas
        username: postgres
        password: postgres
        driver-class-name: org.postgresql.Driver
    jpa:
        show-sql: true
        hibernate:
            ddl-auto: update
        properties:
            hibernate.format_sql: true
