server:
    port: 8084
app:
    jwt:
        secret: ${JWT_SECRET}
        expiracao-minutos: 60
    cors:
        # Origens (endereços do frontend) que podem chamar a API pelo navegador, separadas por vírgula.
        # 5173 é a porta padrão do Vite; remova a que não for a do seu frontend
        origens: http://localhost:5173,http://localhost:517
    frontend:
        url: http://localhost:5173
    mail:
        host: ${MAIL_HOST:localhost}
        port: ${MAIL_PORT:1025}
        username: ${MAIL_USER:}
        password: ${MAIL_PASSWORD:}
        remetente: teste@testeapi.com.br
spring:
    config:
        import: optional:file:.env[.properties]
    data:
        web:
            pageable:
                serialization-mode: via-dto
                max-page-size: 50
    application:
        name: reservasapi
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reservas}
        username: ${DB_USER:postgres}
        password: ${DB_PASSWORD:postgres}
        driver-class-name: org.postgresql.Driver
    jpa:
        show-sql: true
        hibernate:
            ddl-auto: update
        open-in-view: false
        properties:
            hibernate.format_sql: true
springdoc:
    # Não replica todos os @ExceptionHandler em todos os endpoints;
    # cada endpoint declara só os erros que ele realmente pode devolver
    override-with-generic-response: false
    swagger-ui:
        tags-sorter: alpha
        display-request-duration: true
