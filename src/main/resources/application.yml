server:
    port: 8084
spring:
    config:
        import: optional:file:.env[.properties]
    data:
        web:
            pageable:
                serialization-mode: via-dto
                max-page-size: 50
    application:
        name: reservasapi
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT}/${DB_NAME}
        username: ${DB_USER}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver
    jpa:
        show-sql: true
        hibernate:
            ddl-auto: update
        open-in-view: false
        properties:
            hibernate.format_sql: true
